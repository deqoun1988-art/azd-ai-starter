# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azd-ai-starter
metadata:
  template: azd-ai-starter@0.0.1-beta
workflows:
  up:
    steps:
      - azd: provision
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./hooks/postprovision.ps1
    posix:
      shell: sh
      run: ./hooks/postprovision.sh
services:
  frontendapp:
    project: ./src/template-framework-docs
    dist: dist
    language: js
    host: staticwebapp
    hooks:
      preup:
        windows:
          shell: pwsh
          run: npm install; npm run build
          interactive: false
          continueOnError: false
        posix:
          shell: sh
          run: npm install && npm run build
          interactive: false
          continueOnError: false